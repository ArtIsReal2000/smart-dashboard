services:
  - type: web
    name: smart-dashboard
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: smartdash-postgres
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: smartdash-postgres
    databaseName: smartdash
    user: smartdash
    plan: free
    region: oregon
