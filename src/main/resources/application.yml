server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code

app:
  # 32-byte Base64 key for AES-GCM. Generate: openssl rand -base64 32
  # Default dev key provided as fallback (32 bytes base64 encoded)
  encryption-key: ${APP_ENCRYPTION_KEY:u6xW9T3Z1z/J0xP9Yv2N8kR4q7L5s0M8b4V2C1x9A8w=}
  sync:
    gmail-cron: "0 */10 * * * *"   # every 10 minutes
    imap-cron:  "0 */15 * * * *"   # every 15 minutes
  reminders:
    cron: "0 0 8 * * *"            # daily 8 AM

---
# Production Profile: PostgreSQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartdash}
    username: ${SPRING_DATASOURCE_USERNAME:smartdash}
    password: ${SPRING_DATASOURCE_PASSWORD:smartdash}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

---
# Development Profile: H2 In-Memory with auto-init
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:smartdash;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
