<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Reusable Header Fragment -->
<div th:fragment="appHeader(title, user)">
    <header class="h-16 px-5 border-b border-white/10 bg-[#0d121f]/90 backdrop-blur-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="mail-check" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-base font-bold text-white tracking-tight" th:text="${title}">Smart Dashboard</span>
        </div>
        <div class="flex items-center space-x-3" th:if="${user != null}">
            <span class="text-xs text-slate-300" th:text="${user.displayName}">User</span>
            <a th:href="@{/login?logout=true}" class="text-xs text-rose-400 hover:underline">Sign Out</a>
        </div>
    </header>
</div>

<!-- Reusable Tag Chip Fragment -->
<div th:fragment="tagChip(name, color)">
    <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold text-white shadow-sm"
          th:style="'background-color:' + ${color}"
          th:text="${name}">
        Tag
    </span>
</div>

</body>
</html>
